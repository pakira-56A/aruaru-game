version: 2
updates:
  # 更新PRは月1回、gem・npm・GitHub Actions それぞれ最大1本（メジャー更新も同じ1本に入れる）
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns: ["*"]
    ignore:
      # Rails 8.1 のテスト部品が前提にしているのは minitest 5 系（Gemfile で固定している）
      - dependency-name: "minitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Tailwind 4 と daisyui 5 は画面全体の確認が要るので、上げると決めるまで出さない
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "daisyui"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
